steps:
  - name: hashicorp/terraform:1.11.2
    entrypoint: /bin/sh
    args: ["-ec", "cp /bin/terraform /workspace/terraform-bin"]
  - name: python:3.13-bookworm
    entrypoint: python
    args: ["terraform/1-dev/pr-plan/plan.py"]
    env:
      - GITHUB_REPOSITORY=${_GITHUB_REPOSITORY}
      - PR_NUMBER=${_PR_NUMBER}
      - BASE_BRANCH=${_BASE_BRANCH}
      - TF_PROJECT=${_TF_PROJECT}
      - TF_VAR_state_bucket=${_TF_STATE_BUCKET}
      - TF_VAR_github_repository=${_GITHUB_REPOSITORY}
      - BASE_BRANCH_PATTERN_B64=${_BASE_BRANCH_PATTERN_B64}
      - TF_VAR_github_repository_id=${_GITHUB_REPOSITORY_ID}
      - TF_VAR_apply_project_roles=${_APPLY_PROJECT_ROLES}
      - TF_STATE_BUCKET=${_TF_STATE_BUCKET}
      - TERRAFORM=/workspace/terraform-bin
      - BUILD_ID=$BUILD_ID
      - PLAN_ARTIFACT_DIRECTORY=/workspace/.terraform-pr-plans-$BUILD_ID
    secretEnv: ["GITHUB_TOKEN"]
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: publish-terraform-plans
    entrypoint: python3
    args: ["-u", "terraform/1-dev/pr-plan/artifacts.py", "/workspace/.terraform-pr-plans-$BUILD_ID"]
    env:
      - TF_STATE_BUCKET=${_TF_STATE_BUCKET}
      - GITHUB_REPOSITORY=${_GITHUB_REPOSITORY}
      - PR_NUMBER=${_PR_NUMBER}
      - BUILD_ID=$BUILD_ID
    secretEnv: ["GITHUB_TOKEN"]
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/terraform-pr-plan-github-token/versions/latest
      env: GITHUB_TOKEN
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
