name: Terraform PR apply

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      GOOGLE_PROJECT: ${{ vars.TF_APPLY_PROJECT }}
      TF_VAR_project_id: ${{ vars.TF_APPLY_PROJECT }}
      TF_STATE_BUCKET: ${{ vars.TF_APPLY_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.TF_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 -B terraform/1-dev/pr-plan/apply.py
